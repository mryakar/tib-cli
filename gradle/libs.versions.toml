[versions]
# The stack that the default pack generates. generated-postgres is the tag of the postgres Docker
# image, which Dependabot does not update.
generated-postgres = "17"
generated-spring-boot = "3.5.16"
google-java-format = "1.36.1"
groovy = "5.1.3"
# The engine's Jackson: it reads the spec and the state file and writes the JSON Schema.
jackson = "3.2.4"
jacoco = "0.8.16"
jreleaser = "1.26.0"
json-schema-validator = "3.0.8"
jsqlparser = "5.4"
jte = "3.2.4"
junit = "6.1.3"
ktfmt = "0.65"
picocli = "4.7.7"
spock = "2.5-groovy-5.0"
spotless = "8.10.4"

[libraries]
groovy-bom = { module = "org.apache.groovy:groovy-bom", version.ref = "groovy" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }
jte-runtime = { module = "gg.jte:jte-runtime", version.ref = "jte" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }

# Declared as libraries only so that Dependabot updates their versions; the build and the release
# workflow read the versions: the tools that they run, and the Spring Boot of the generated projects.
generated-spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "generated-spring-boot" }
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
jreleaser-tool-provider = { module = "org.jreleaser:jreleaser-tool-provider", version.ref = "jreleaser" }
ktfmt = { module = "org.jetbrains.kotlinx:ktfmt", version.ref = "ktfmt" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }

# Gradle plugins used by the convention plugins in build-logic
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
jte-gradle-plugin = { module = "gg.jte:jte-gradle-plugin", version.ref = "jte" }
