[versions]
google-java-format = "1.36.1"
groovy = "5.1.3"
# The version that the CLI's Spring Boot manages; the engine takes it from here.
jackson = "3.1.7"
jacoco = "0.8.15"
json-schema-validator = "2.0.4"
jte = "3.2.4"
junit = "6.1.3"
ktfmt = "0.65"
picocli = "4.7.7"
spock = "2.5-groovy-5.0"
# The CLI's own runtime. The projects it generates pick their Spring Boot version from the pack.
spring-boot = "4.1.2"

[libraries]
groovy-bom = { module = "org.apache.groovy:groovy-bom", version.ref = "groovy" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jte-runtime = { module = "gg.jte:jte-runtime", version.ref = "jte" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
picocli-spring-boot-starter = { module = "info.picocli:picocli-spring-boot-starter", version.ref = "picocli" }
spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }

# Tools that the build runs. They are declared as libraries only so that Dependabot updates their
# versions; the build reads the versions.
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
ktfmt = { module = "org.jetbrains.kotlinx:ktfmt", version.ref = "ktfmt" }

# Gradle plugins used by the convention plugins in build-logic
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.10.4" }
jte-gradle-plugin = { module = "gg.jte:jte-gradle-plugin", version.ref = "jte" }
