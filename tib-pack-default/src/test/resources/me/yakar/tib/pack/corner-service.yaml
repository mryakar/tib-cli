# The corners of the service: Java 25, which is not the default, and a Dockerfile; and of the entity
# layer: an audited entity with a sequence identifier in a column that
# the spec names, a one-to-one relation, a relation to itself and two relations to one target, an
# entity without DTOs and with a Text that is required, one without a mapper, one without
# pagination, one with nothing to import, one whose name takes "an" and has a required relation and
# a field named as itself, and every type.
tib: 1
service: corner-service
group: me.yakar
java: 25
docker: true
entities:
  - name: Branch
    id: { strategy: sequence, column: BRANCH_KEY }
    audit: true
    fields:
      - { name: code, type: String, nullable: false }
      - { name: count, type: Long }
      - { name: open, type: Boolean }
      - { name: openedAt, type: LocalDateTime }
      - { name: seenAt, type: Instant }
      - { name: token, type: UUID }
      - { name: ratio, type: BigDecimal }
      - { name: amount, type: BigDecimal, precision: 10 }
      - { name: memo, type: Text }
    relations:
      - { kind: oneToOne, target: Branch, field: parent, nullable: true }
    options: { pagination: false }
  - name: Note
    fields:
      - { name: text, type: String, length: 2000 }
      - { name: body, type: Text, nullable: false }
    options: { dto: false }
  - name: Tag
    fields:
      - { name: label, type: String }
    relations:
      - { kind: manyToOne, target: Branch, nullable: false }
      - { kind: manyToOne, target: Branch, field: other }
  - name: Plain
    fields:
      - { name: label, type: String }
    options: { mapper: false }
  - name: Item
    fields:
      - { name: label, type: String }
      - { name: item, type: String }
    relations:
      - { kind: manyToOne, target: Branch, nullable: false }
