# The documentation component. Its version comes from the playbook: the tag of a release, or main.
name: tib
title: tib
nav:
  - modules/ROOT/nav.adoc
# The command reference and the schema of the spec file, generated by the build of the same commit.
# The command runs in the root of the repository, which is also the base of the scanned directory.
ext:
  collector:
    run:
      command: ./gradlew -q :tib-cli:antoraContent
    scan:
      dir: tib-cli/build/docs/antora
