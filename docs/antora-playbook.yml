# Builds the documentation site from this repository: the pages under docs/ and the command
# reference that the build generates from the commands themselves. The main branch is the version
# called main and each release tag vX.Y.Z the version X.Y.Z; pre-release tags are left out. The
# Collector extension generates the reference of each version from its own commit (see antora.yml).
antora:
  extensions:
    - '@antora/collector-extension'
site:
  title: tib
  url: https://mryakar.github.io/tib-cli
  start_page: tib::index.adoc
content:
  sources:
    - url: ..
      branches: HEAD
      tags: [v*, '!v*-*']
      start_path: docs
      version:
        v(?<version>+({0..9}).+({0..9}).+({0..9})): $<version>
        '*': main
ui:
  # One build of the default UI. To move to a newer one, take the job that
  # https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
  # redirects to.
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/15385706035/artifacts/raw/build/ui-bundle.zip
  # The default UI's header, with its placeholder menu replaced by links to the repository.
  supplemental_files: ./supplemental-ui
output:
  dir: build/site
