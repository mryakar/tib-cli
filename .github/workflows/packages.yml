# Builds the packages of each platform and installs them, as a user would, before it uploads them:
# each installed tib loads its start-up cache and scaffolds a service.
# The build workflow runs it on every change, and the release workflow for the files of a release.
name: Packages

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS on both of its processors: Apple silicon, and Intel while GitHub has a runner of it.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Code is compiled with JDK 21; the packages embed a runtime of JDK 25.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew packages

      - name: Install the .deb and run tib
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./tib-cli/build/packages/tib_*.deb
          command -v tib
          .github/scripts/smoke-tib.sh tib /opt/tib/lib/app "$RUNNER_TEMP/deb"
          sudo apt-get remove -y tib
          if [[ -e /usr/bin/tib ]]; then echo "/usr/bin/tib is still there" >&2; exit 1; fi
          if [[ -e /opt/tib ]]; then find /opt/tib >&2; echo "/opt/tib is still there" >&2; exit 1; fi
      - name: Install the .msi and run tib
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-Item tib-cli\build\packages\tib-*.msi
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content install.log; throw "msiexec exited with $($install.ExitCode)" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike '*\tib*') { throw "the installer did not put tib on the PATH: $machinePath" }
          $env:Path = $machinePath
          tib --version
          if ($LASTEXITCODE -ne 0) { throw "tib --version exited with $LASTEXITCODE" }
          $installDir = Split-Path (Get-Command tib).Source
          if (-not (Test-Path "$installDir\app\tib.aot")) { throw "the installer built no start-up cache" }
          $env:JAVA_TOOL_OPTIONS = '-XX:AOTMode=on'
          tib --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "tib does not load its start-up cache" }
          $env:JAVA_TOOL_OPTIONS = $null
          tib init service smoke -d "$env:RUNNER_TEMP\msi\smoke"
          if ($LASTEXITCODE -ne 0) { throw "tib init service exited with $LASTEXITCODE" }
          if (-not (Test-Path "$env:RUNNER_TEMP\msi\smoke\gradlew.bat")) { throw "the service has no gradlew.bat" }
          $uninstall = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstall exited with $($uninstall.ExitCode)" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -like '*\tib*') { throw "the uninstaller left tib on the PATH: $machinePath" }
          if (Test-Path $installDir) { Get-ChildItem -Recurse $installDir; throw "the uninstaller left $installDir" }
      # The zip has no start-up cache until its script has run, as the install page says.
      - name: Unpack the portable zip and run tib
        run: |
          mkdir portable
          unzip -q -d portable tib-cli/build/packages/tib-*.zip
          if [[ "$RUNNER_OS" == Windows ]]; then
            tib=portable/tib/tib.exe app=portable/tib/app
            cmd.exe //c 'portable\tib\app\startup-cache.cmd'
          elif [[ "$RUNNER_OS" == macOS ]]; then
            tib=portable/tib.app/Contents/MacOS/tib app=portable/tib.app/Contents/app
            "$app/startup-cache.sh"
          else
            tib=portable/tib/bin/tib app=portable/tib/lib/app
            "$app/startup-cache.sh"
          fi
          .github/scripts/smoke-tib.sh "$tib" "$app" "$RUNNER_TEMP/portable"

      # The formula that a release writes into the tap, here from a tap of this runner and the zip on
      # its disk: Homebrew installs it, builds its start-up cache and runs its test.
      - name: Install the zip with Homebrew and run tib
        if: runner.os == 'macOS'
        run: |
          zip="$(ls "$PWD"/tib-cli/build/packages/tib-*-macos-*.zip)"
          version="$(basename "$zip")"
          version="${version#tib-}"
          version="${version%-macos-*}"
          sha256="$(shasum -a 256 "$zip" | cut -d ' ' -f 1)"
          brew tap-new --no-git tib/local
          .github/scripts/homebrew-formula.sh "$version" "file://$zip" "$sha256" "file://$zip" "$sha256" \
            > "$(brew --repository tib/local)/Formula/tib.rb"
          brew install tib/local/tib
          .github/scripts/smoke-tib.sh tib "$(brew --prefix tib)/libexec/tib.app/Contents/app" "$RUNNER_TEMP/brew"
          brew test tib/local/tib
          brew uninstall tib
          brew untap tib/local
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}-${{ runner.arch }}
          path: tib-cli/build/packages/*
          if-no-files-found: error
          retention-days: 7
