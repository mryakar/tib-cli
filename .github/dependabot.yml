version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Versions younger than two weeks are left alone; security updates are not held back.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Groovy follows the Spock variant (spock-*-groovy-5.0); move both together.
      - dependency-name: org.apache.groovy:groovy-bom
        update-types: [version-update:semver-major]
      # A major version of Spring Boot is another stack than the one the default pack generates.
      - dependency-name: org.springframework.boot:spring-boot-gradle-plugin
        update-types: [version-update:semver-major]
    groups:
      # The Spring Boot of the generated services changes the snapshots; its update comes alone.
      generated-spring-boot:
        patterns: ["org.springframework.boot:spring-boot-gradle-plugin"]
      # The libraries whose versions the packs write into a service change the snapshots; their
      # updates come together. JUnit is the JUnit of this build's tests too.
      generated-libraries:
        patterns:
          - "com.tngtech.archunit:*"
          - "org.flywaydb:*"
          - "org.junit:*"
          - "org.mockito:*"
          - "org.postgresql:*"
          - "org.testcontainers:*"
          - "tools.jackson.core:*"
      # The formatter and the plugin that runs it move together. google-java-format also formats
      # what the packs generate: its update changes the snapshots and comes with them.
      format:
        patterns: ["com.diffplug.spotless:*", "com.google.googlejavaformat:*"]
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs
    # package.json overrides the js-yaml of the Antora Collector, which asks for ~4.1, a range with
    # no release past the known vulnerabilities: remove the override once a Collector release asks
    # for js-yaml 4.3 or later.
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      docs:
        patterns: ["*"]
