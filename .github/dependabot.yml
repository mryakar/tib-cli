version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Versions younger than two weeks are left alone; security updates are not held back.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Groovy follows the Spock variant (spock-*-groovy-5.0); move both together.
      - dependency-name: org.apache.groovy:groovy-bom
        update-types: [version-update:semver-major]
      # google-java-format 1.37 fails under Spotless 8.10 with NoSuchMethodError; move up with Spotless.
      - dependency-name: com.google.googlejavaformat:google-java-format
        versions: [">=1.37.0"]
      # Jackson is the version that the CLI's Spring Boot manages; it moves with Spring Boot.
      - dependency-name: tools.jackson:jackson-bom
      # json-schema-validator 3 brings Jackson 3.2 into the tests, past the CLI's Jackson; it moves
      # when Spring Boot manages Jackson 3.2.
      - dependency-name: com.networknt:json-schema-validator
        update-types: [version-update:semver-major]
      # The default pack generates Spring Boot 3 services; a major version changes what it generates.
      - dependency-name: org.springframework.boot:spring-boot-gradle-plugin
        update-types: [version-update:semver-major]
    groups:
      # The Spring Boot of the generated services changes the snapshots; its update comes alone.
      generated-stack:
        patterns: ["org.springframework.boot:spring-boot-gradle-plugin"]
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      docs:
        patterns: ["*"]
